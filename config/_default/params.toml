# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon        = "img/favicon.png"

description = "嵌入式开发与控制理论学习笔记，涵盖STM32、FreeRTOS、卡尔曼滤波、PID控制、平衡车项目等技术分享"

# Accepted values: "default", "lastmod"
SortBy              = "default"

[footer]
    since      = 2026
    customText = ""

[dateFormat]
    published   = "2006-01-02"
    lastUpdated = "2006-01-02"

[sidebar]
    emoji    = "🤖"
    subtitle = "控制理论 · 嵌入式"
    avatar   = "img/avatar.png"

[article]
    headingAnchor = false
    math          = true
    readingTime   = true
    toc           = true

    [article.list]
        showTags = true

    [article.license]
        enabled = true
        default = "Licensed under CC BY-NC-SA 4.0"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

## Comments
[comments]
    enabled  = true
    provider = "giscus"

    [comments.giscus]
        repo             = "129700/129700.github.io"
        repoID           = ""
        category         = "Announcements"
        categoryID       = ""
        mapping          = "pathname"
        lightTheme       = "light"
        darkTheme        = "dark_dimmed"
        reactionsEnabled = 1
        emitMetadata     = 0
        inputPosition    = "top"
        lang             = "zh-CN"
        strict           = 0
        loading          = "lazy"