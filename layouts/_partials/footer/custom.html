<div class="reading-progress" id="reading-progress"></div>

<button class="back-to-top" id="back-to-top" title="回到顶部" aria-label="回到顶部">↑</button>

<script>
(function() {
    var progressBar = document.getElementById('reading-progress');
    if (progressBar) {
        var ticking = false;
        function updateProgress() {
            var scrollTop = window.scrollY;
            var docHeight = document.documentElement.scrollHeight - window.innerHeight;
            var progress = docHeight > 0 ? Math.min((scrollTop / docHeight) * 100, 100) : 0;
            progressBar.style.width = progress + '%';
            ticking = false;
        }
        window.addEventListener('scroll', function() {
            if (!ticking) { requestAnimationFrame(updateProgress); ticking = true; }
        }, { passive: true });
    }

    var backBtn = document.getElementById('back-to-top');
    if (backBtn) {
        var showTick = false;
        function toggleBackBtn() {
            if (window.scrollY > 400) backBtn.classList.add('is-visible');
            else backBtn.classList.remove('is-visible');
            showTick = false;
        }
        window.addEventListener('scroll', function() {
            if (!showTick) { requestAnimationFrame(toggleBackBtn); showTick = true; }
        }, { passive: true });

        backBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }
})();
</script>
